<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlyLink 平台管理数据</title>
    <link rel="stylesheet" href="/assets/index-DM7TVN1r.css" />
  <link rel="stylesheet" href="/assets/AdminDashboard.css?v=20261008-admin-overview-1" />
    <link rel="stylesheet" href="/assets/first-batch.css?v=20261003-layout-1" />
    <link rel="stylesheet" href="/assets/first-batch-fixups.css?v=20261002-first-batch-2" />
    <link rel="stylesheet" href="/assets/flylink-light.css?v=20261008-logo-3" />
  </head>
  <body>
    <div class="admin-shell">
      <header class="admin-nav glass-panel">
        <a class="brand" href="/admin-dashboard.html">
          <span class="admin-logo-mark" aria-hidden="true"></span>
          <span class="brand-text"><strong class="brand-name">FlyLink</strong><span class="brand-cn">飞链 · 管理员端</span></span>
        </a>
        <nav class="admin-tabs" aria-label="管理工作台分类">
          <button class="active" data-admin-tab="overview">运营总览</button>
          <button data-admin-tab="users">用户与资质审核</button>
          <button data-admin-tab="orders">订单监管</button>
          <button data-admin-tab="airspace">空域与合规</button>
          <button data-admin-tab="finance">资金管理</button>
          <button data-admin-tab="risk">风险与日志</button>
        </nav>
        <div class="admin-actions"><span id="admin-name">平台管理员</span><button id="logout" type="button">退出登录</button></div>
      </header>
      <main class="admin-dashboard">
        <section class="admin-hero glass-panel">
          <p class="eyebrow">PLATFORM ADMINISTRATION</p>
          <h1>平台运营总览</h1>
          <p class="muted">实时掌握企业、飞手与作业订单的核心运营情况。</p>
        </section>
        <p id="admin-status" class="admin-loading">数据加载中……</p>
        <section id="admin-stats" class="admin-stats" hidden></section>
        <section class="admin-review glass-panel" data-admin-panel="overview">
          <div class="admin-review-title"><div><p class="eyebrow">WORK REVIEW</p><h2>待审核作业</h2></div><button id="refresh-review" type="button">刷新</button></div>
          <div id="review-orders"><p class="admin-loading">正在加载待审核订单……</p></div>
        </section>
        <section class="admin-workspace glass-panel" data-admin-panel="users" hidden><div class="admin-review-title"><div><p class="eyebrow">IDENTITY REVIEW</p><h2>用户与资质审核</h2></div></div><div id="admin-users"></div></section>
        <section class="admin-workspace glass-panel" data-admin-panel="orders" hidden><div class="admin-review-title"><div><p class="eyebrow">ORDER SUPERVISION</p><h2>订单全流程监管</h2></div></div><div id="admin-orders"></div></section>
        <section class="admin-workspace glass-panel" data-admin-panel="airspace" hidden><div class="admin-review-title"><div><p class="eyebrow">AIRSPACE COMPLIANCE</p><h2>空域与天气合规复核</h2></div></div><div id="admin-airspace"></div></section>
        <section class="admin-workspace glass-panel" data-admin-panel="finance" hidden><div class="admin-review-title"><div><p class="eyebrow">ESCROW FINANCE</p><h2>托管与结算管理</h2></div></div><div id="admin-finance"></div></section>
        <section class="admin-workspace glass-panel" data-admin-panel="risk" hidden><div class="admin-review-title"><div><p class="eyebrow">RISK & AUDIT</p><h2>风险告警与操作日志</h2></div></div><div id="admin-risk"></div></section>
      </main>
    </div>
    <script type="module" src="/assets/admin-dashboard.js?v=20261008-admin-overview-1"></script>
  <script src="/assets/admin-review-fixes.js?v=20261003-order-date-fix-1"></script>
  <script src="/assets/qrcode.min.js"></script>
  <script src="/assets/roadshow-qr.js?v=20261008-roadshow-2"></script>
</body>
</html>
